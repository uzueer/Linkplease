services:
  postgres:
    image: postgres:16-alpine
    container_name: linkplease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkplease
      POSTGRES_PASSWORD: linkplease
      POSTGRES_DB: linkplease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: linkplease-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: